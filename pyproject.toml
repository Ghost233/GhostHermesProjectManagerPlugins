# Hermes loads this standalone plugin from its directory. Keep its workspace
# member metadata-only so the native PM can name each Profile's copy separately.

[project]
name = "ghost-hermes-pm"
version = "0.1.0"
description = "Hermes project and Profile directory management"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "requests>=2,<3", "websockets>=15,<16"]

[project.optional-dependencies]
test = ["ruff==0.15.10", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "PyYAML>=6,<7", "ruamel.yaml>=0.18,<1", "rich>=13,<16", "python-dotenv>=1,<2", "requests>=2,<3", "prompt_toolkit>=3,<4", "croniter>=6,<7", "lark-oapi==1.6.8", "psutil==7.2.2; sys_platform != 'android'", "openai==2.24.0", "anthropic==0.87.0", "Pillow==12.3.0", "tenacity==9.1.4"]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["ghost_hermes_pm*"]

[tool.setuptools.package-data]
ghost_hermes_pm = ["*.mjs", "trusted_controller.c"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_shared_only_execution.py",
    "tests/test_shared_repository.py",
    "tests/test_shared_native_hook.py",
    "tests/test_shared_tools_native.py",
    "tests/test_simple_intake.py",
    "tests/test_owned_driver.py",
    "tests/test_native_slash_cards.py",
    "tests/test_repository_approval_cards.py",
    "tests/test_repository_approval_replies.py",
    "tests/test_repository_question_reconciliation.py",
    "tests/test_repository_test_runner.py",
    "tests/test_repository_github.py",
    "tests/test_dsh_configuration.py",
    "tests/test_dsh_remote.py",
    "tests/test_plugin_entry.py",
    "tests/test_plugin_manifest.py",
    "tests/test_plugin_hook_contract.py",
    "tests/test_sdk_test_seam_check.py",
    "tests/test_unmodified_sdk_source.py",
    "tests/test_local_checks.py",
    "tests/test_phase_gate.py",
    "tests/test_sdk_source_integrity.py",
]
addopts = "-m 'not retired_independent_runtime'"
markers = ["retired_independent_runtime: historical standalone DSH startup and lifecycle; excluded from the shared Desktop regression"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F821"]
