[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-hermes-pm"
version = "0.1.0"
description = "Hermes project and Profile directory management"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "requests>=2,<3"]

[project.optional-dependencies]
test = ["ruff==0.16.8", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "PyYAML>=6,<7", "ruamel.yaml>=0.18,<1", "rich>=13,<16", "python-dotenv>=1,<2", "requests>=2,<3", "prompt_toolkit>=3,<4", "croniter>=6,<7", "lark-oapi==1.6.8", "psutil==7.2.2", "openai==2.24.0", "anthropic==0.87.0", "Pillow==12.3.0", "tenacity==9.1.4"]

[tool.setuptools.packages.find]
include = ["ghost_hermes_pm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F821"]
