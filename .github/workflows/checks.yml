name: Plugin checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  behavior-and-native-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check out fixed Hermes SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: bd0affe5e5f723579df8902852f5d0c47795f355
          path: .ci/hermes-sdk
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify public behavior and required native runtime
        env:
          HERMES_TEST_SDK_ROOT: ${{ github.workspace }}/.ci/hermes-sdk
          HERMES_REQUIRE_SDK_SMOKE: "1"
        run: python -m pytest -q
      - name: Prepare Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check Dashboard script
        run: node --check dashboard/dist/index.js
      - name: Check patch formatting
        run: git diff --check
