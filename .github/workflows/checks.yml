name: Plugin static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  behavior-and-native-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Prepare Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check Python undefined names
        run: python -m ruff check --no-cache --select F821 ghost_hermes_pm tests tools __init__.py
      - name: Check SDK test boundaries
        run: python tools/check_sdk_test_seams.py
      - name: Check active DSH hook syntax
        run: node --check ghost_hermes_pm/shared_native_hook.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD
