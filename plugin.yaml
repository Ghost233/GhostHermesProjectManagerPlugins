name: ghost-hermes-pm
version: "0.1.0"
description: Coordinate bound local repositories through native Kanban, shared DSH Desktop and Feishu.
kind: standalone
manifest_version: 2
provides_tools:
  - hermes_pm_snapshot
  - hermes_pm_repository_rework
  - hermes_pm_supervise
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
  - post_tool_call
python_dependencies:
  - fastapi
  - requests
  - websockets>=15,<16
